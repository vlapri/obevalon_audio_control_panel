name: Release

on:
  # Either push a tag vX.Y.Z ...
  push:
    tags: ['v*.*.*']
  # ... or run the workflow manually (Actions → Release → Run workflow); it creates the tag itself.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 or 1.3.0-beta.1 (tag vX.Y.Z is created on the selected branch)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION.Trim().TrimStart('v') } else { $env:REF_NAME.Substring(1) }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$version' is not a valid SemVer version (X.Y.Z)." }
          $tag = "v$version"
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and (git ls-remote --tags origin "refs/tags/$tag")) {
            throw "Tag $tag already exists. Choose a new version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Obevalon.AudioControlPanel -c Release -r $rid -p:PublishSingleFile=true -p:Version=$v -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid." }

            # Plain exe (downloaded by the in-app updater) and a zip for manual download.
            Copy-Item "out/$rid/OACP.exe" "dist/OACP-$v-$rid.exe"
            $staging = "staging/$rid"
            New-Item -ItemType Directory -Force $staging | Out-Null
            Copy-Item "out/$rid/OACP.exe", LICENSE, README.md $staging
            Compress-Archive -Path "$staging/*" -DestinationPath "dist/OACP-$v-$rid.zip"
          }

      - name: Create and sign update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: >
          ./build/make-update-manifest.ps1
          -Version '${{ steps.version.outputs.version }}'
          -DistDir dist
          -Repository '${{ github.repository }}'

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            'release', 'create', '${{ steps.version.outputs.tag }}',
            '--title', 'Obevalon Audio Control Panel ${{ steps.version.outputs.version }}',
            '--generate-notes')
          # A pushed tag must already exist; a manual run creates the tag on the built commit.
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $ghArgs += @('--target', $env:GITHUB_SHA) } else { $ghArgs += '--verify-tag' }
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          $ghArgs += (Get-ChildItem dist -File).FullName
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }

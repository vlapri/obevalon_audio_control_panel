name: Release

on:
  # Either push a tag vX.Y.Z ...
  push:
    tags: ['v*.*.*']
  # ... or run the workflow manually (Actions → Release → Run workflow); it creates the tag itself.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 or 1.3.0-beta.1 (tag vX.Y.Z is created on the selected branch)'
        required: true
        type: string

permissions:
  contents: write
  # SignPath reads the job details and downloads the unsigned artifact with the workflow token.
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION.Trim().TrimStart('v') } else { $env:REF_NAME.Substring(1) }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$version' is not a valid SemVer version (X.Y.Z)." }
          $tag = "v$version"
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and (git ls-remote --tags origin "refs/tags/$tag")) {
            throw "Tag $tag already exists. Choose a new version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force unsigned | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Obevalon.AudioControlPanel -c Release -r $rid -p:PublishSingleFile=true -p:Version=$v -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid." }
            Copy-Item "out/$rid/OACP.exe" "unsigned/OACP-$v-$rid.exe"
          }

      # Code signing through SignPath (free for open source, certificate by SignPath Foundation).
      # Enabled when the repository variable SIGNPATH_ORGANIZATION_ID is set; see docs/RELEASING.md.
      # Without it the release is built unsigned (Windows Smart App Control will block it).
      - name: Upload unsigned executables for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-executables
          path: unsigned/
          if-no-files-found: error
          retention-days: 1

      - name: Sign executables (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing requests are approved manually in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Package
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $signed = $env:SIGNING_ENABLED -eq 'true'
          if (-not $signed) { Write-Output '::warning::SignPath is not configured, the executables are NOT code-signed.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            $exe = if ($signed) { "signed/OACP-$v-$rid.exe" } else { "unsigned/OACP-$v-$rid.exe" }
            if (-not (Test-Path $exe)) { throw "Missing $exe" }
            if ($signed) {
              $signature = Get-AuthenticodeSignature $exe
              if ($signature.Status -ne 'Valid') { throw "$exe is not validly signed: $($signature.Status) $($signature.StatusMessage)" }
              Write-Output "$exe signed by: $($signature.SignerCertificate.Subject)"
            }

            # Plain exe (downloaded by the in-app updater) and a zip for manual download.
            Copy-Item $exe "dist/OACP-$v-$rid.exe"
            $staging = "staging/$rid"
            New-Item -ItemType Directory -Force $staging | Out-Null
            Copy-Item $exe "$staging/OACP.exe"
            Copy-Item LICENSE, README.md $staging
            Compress-Archive -Path "$staging/*" -DestinationPath "dist/OACP-$v-$rid.zip"
          }

      - name: Create and sign update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: >
          ./build/make-update-manifest.ps1
          -Version '${{ steps.version.outputs.version }}'
          -DistDir dist
          -Repository '${{ github.repository }}'

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            'release', 'create', '${{ steps.version.outputs.tag }}',
            '--title', 'Obevalon Audio Control Panel ${{ steps.version.outputs.version }}',
            '--generate-notes')
          # A pushed tag must already exist; a manual run creates the tag on the built commit.
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $ghArgs += @('--target', $env:GITHUB_SHA) } else { $ghArgs += '--verify-tag' }
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          $ghArgs += (Get-ChildItem dist -File).FullName
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }

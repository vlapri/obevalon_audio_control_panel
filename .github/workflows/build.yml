name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish test build (win-x64)
        run: >
          dotnet publish src/Obevalon.AudioControlPanel -c Release -r win-x64
          -p:PublishSingleFile=true -p:Version=0.0.0-ci.${{ github.run_number }}
          -o out/win-x64

      - name: Upload test build
        uses: actions/upload-artifact@v5
        with:
          name: OACP-ci-${{ github.run_number }}-win-x64
          path: out/win-x64/OACP.exe
          retention-days: 14

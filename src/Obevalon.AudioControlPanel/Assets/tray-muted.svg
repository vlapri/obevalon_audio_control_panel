<!-- System tray icon while the microphone is muted (red "off" badge). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F80ED" />
      <stop offset="1" stop-color="#7B3FE4" />
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="url(#bg)" />
  <path d="M5 12 h4 l6 -5 v18 l-6 -5 h-4 a1 1 0 0 1 -1 -1 v-6 a1 1 0 0 1 1 -1 z" fill="#FFFFFF" />
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round">
    <path d="M19 12 A5.5 5.5 0 0 1 19 20" />
  </g>

  <!-- Muted badge: red circle with a slash (kept simple so it stays legible at 16 px) -->
  <circle cx="23" cy="23" r="8.5" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M19.6 19.6 L26.4 26.4" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
</svg>
